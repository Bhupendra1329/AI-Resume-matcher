<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Resume Matcher & Job Application Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <h1>AI Resume Matcher</h1>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Log In</button>
      <button class="tab-btn" data-tab="register">Register</button>
    </div>

    <form id="login-form" class="auth-form">
      <label>Email</label>
      <input type="email" id="login-email" required placeholder="you@example.com">
      <label>Password</label>
      <input type="password" id="login-password" required placeholder="Password">
      <button type="submit" class="primary-btn">Log In</button>
      <p class="form-msg" id="login-msg"></p>
    </form>

    <form id="register-form" class="auth-form hidden">
      <label>Name</label>
      <input type="text" id="reg-name" required placeholder="Your name">
      <label>Email</label>
      <input type="email" id="reg-email" required placeholder="you@example.com">
      <label>Password</label>
      <input type="password" id="reg-password" required placeholder="Password">
      <button type="submit" class="primary-btn">Create Account</button>
      <p class="form-msg" id="register-msg"></p>
    </form>
  </div>
</div>

<!-- MAIN APP -->
<div id="app-screen" class="app-wrap hidden">
  <header class="topbar">
    <h2>Resume Matcher</h2>
    <div class="user-box">
      <span id="user-name-label"></span>
      <button id="logout-btn" class="ghost-btn">Log out</button>
    </div>
  </header>

  <nav class="main-nav">
    <button class="nav-btn active" data-view="applications-view">Applications</button>
    <button class="nav-btn" data-view="matcher-view">Resume Matcher</button>
  </nav>

  <!-- ===================== APPLICATIONS VIEW ===================== -->
  <div id="applications-view" class="view">
    <section class="dashboard">
      <div class="stat-card total">
        <p class="stat-num" id="stat-total">0</p>
        <p class="stat-label">Total</p>
      </div>
      <div class="stat-card applied">
        <p class="stat-num" id="stat-applied">0</p>
        <p class="stat-label">Applied</p>
      </div>
      <div class="stat-card interview">
        <p class="stat-num" id="stat-interview">0</p>
        <p class="stat-label">Interview</p>
      </div>
      <div class="stat-card offer">
        <p class="stat-num" id="stat-offer">0</p>
        <p class="stat-label">Offer</p>
      </div>
      <div class="stat-card rejected">
        <p class="stat-num" id="stat-rejected">0</p>
        <p class="stat-label">Rejected</p>
      </div>
    </section>

    <section class="toolbar">
      <input type="text" id="search-input" placeholder="Search by company...">
      <select id="filter-status">
        <option value="">All statuses</option>
        <option value="Applied">Applied</option>
        <option value="Interview">Interview</option>
        <option value="Offer">Offer</option>
        <option value="Rejected">Rejected</option>
      </select>
      <button id="add-app-btn" class="primary-btn">+ Add Application</button>
    </section>

    <section id="app-list" class="app-list"></section>
  </div>

  <!-- ===================== MATCHER VIEW ===================== -->
  <div id="matcher-view" class="view hidden">
    <section class="matcher-card">
      <h3>Analyze a Resume Against a Job Description</h3>
      <form id="match-form">
        <label>Resume file (PDF, DOCX, or TXT)</label>
        <input type="file" id="match-resume" accept=".pdf,.docx,.txt" required>

        <label>Link to an application (optional)</label>
        <select id="match-app-link">
          <option value="">— Not linked to a specific application —</option>
        </select>

        <label>Job Description</label>
        <textarea id="match-jd" rows="6" required placeholder="Paste the job description here..."></textarea>

        <button type="submit" class="primary-btn">Analyze Match</button>
        <p class="form-msg" id="match-msg"></p>
      </form>
    </section>

    <section id="match-result" class="match-result hidden">
      <div class="score-ring-wrap">
        <div class="score-ring" id="score-ring">
          <span id="score-value">0%</span>
        </div>
        <p class="score-label">Overall Match Score</p>
      </div>

      <div class="skills-columns">
        <div class="skills-col matched">
          <h4>Matched Skills</h4>
          <div id="matched-skills" class="chip-list"></div>
        </div>
        <div class="skills-col missing">
          <h4>Missing Skills</h4>
          <div id="missing-skills" class="chip-list"></div>
        </div>
      </div>

      <p class="suggestion-text" id="suggestion-text"></p>
    </section>

    <section class="history-section">
      <h3>Match History</h3>
      <div id="match-history-list" class="history-list"></div>
    </section>
  </div>
</div>

<!-- ADD APPLICATION MODAL -->
<div id="add-modal" class="modal hidden">
  <div class="modal-card">
    <h3>Add Application</h3>
    <form id="add-form">
      <label>Company</label>
      <input type="text" id="add-company" required placeholder="e.g. Google">
      <label>Role</label>
      <input type="text" id="add-role" required placeholder="e.g. Backend Intern">
      <label>Status</label>
      <select id="add-status">
        <option value="Applied">Applied</option>
        <option value="Interview">Interview</option>
        <option value="Offer">Offer</option>
        <option value="Rejected">Rejected</option>
      </select>
      <label>Notes</label>
      <textarea id="add-notes" rows="3" placeholder="Optional notes"></textarea>
      <div class="modal-actions">
        <button type="button" id="cancel-add" class="ghost-btn">Cancel</button>
        <button type="submit" class="primary-btn">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
